<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO -->
    <title>Admin Panel — MisiPulsa</title>
    <meta name="description" content="Panel administrasi MisiPulsa.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MisiPulsa">
    <meta property="og:locale" content="id_ID">
    <meta property="og:title" content="Admin Panel — MisiPulsa">
    <meta property="og:description" content="Panel administrasi MisiPulsa.">
    <meta property="og:url" content="/admin">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Admin Panel — MisiPulsa">
    <meta name="twitter:description" content="Panel administrasi MisiPulsa.">
    <meta name="twitter:image" content="/og-image.png">

    <!-- Percepatan: preconnect ke CDN & font -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- Font Awesome async (tidak memblokir render) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Ubah URL OG relatif menjadi absolut sesuai domain saat ini -->
    <script>
        (function () {
            var abs = function (sel, attr) {
                var els = document.querySelectorAll(sel);
                for (var i = 0; i < els.length; i++) {
                    var v = els[i].getAttribute(attr);
                    if (v && v.indexOf('http') !== 0) els[i].setAttribute(attr, window.location.origin + v);
                }
            };
            abs('meta[property="og:url"]', 'content');
            abs('meta[property="og:image"]', 'content');
            abs('meta[property="og:image:secure_url"]', 'content');
            abs('meta[name="twitter:image"]', 'content');
        })();
    </script>
</head>
<body style="background: #0a0a1a; color: white; min-height: 100vh; padding: 20px 10px;">
    
    <div id="toast" class="toast"></div>

    <div class="bg-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid"></div>
    </div>

    <div style="max-width: 800px; margin: 0 auto; position: relative; z-index: 10; padding-bottom: 80px;">
        
        <!-- TOP NAV -->
        <div style="display: flex; align-items: center; margin-bottom: 20px; padding: 12px 16px; background: rgba(255,255,255,0.05); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);">
            <span style="font-size: 18px; margin-right: 10px;"><i class="fas fa-wrench"></i></span>
            <h2 style="font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Admin Panel</h2>
        </div>

        <!-- MAIN ADMIN CONTAINER -->
        <div id="adminContentContainer">
            <div id="adminContent"></div>
        </div>
    </div>

    <!-- SUPABASE JS SDK -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
        <script defer src="config.js"></script>
<script defer src="sistem.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof checkSupabaseSession === 'function') {
                await checkSupabaseSession();
            }
            // GUARD ADMIN: hanya user dengan isAdmin dari database yang boleh masuk.
            if (!currentUser || !currentUser.isAdmin) {
                showToast('⛔ Akses ditolak: hanya admin yang dapat membuka panel ini.', 'error');
                setTimeout(() => { window.location.href = '/login'; }, 1200);
                return;
            }
            // Muat misi & penarikan langsung dari tabel Supabase, lalu render
            if (typeof openAdminPanel === 'function') await openAdminPanel();
            else if (typeof renderAdminPanel === 'function') renderAdminPanel();
        });
    </script>
</body>
</html>
