<!DOCTYPE html>
<html lang="id" class="dashboard-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO -->
    <title>Dashboard — MisiPulsa</title>
    <meta name="description" content="Kumpulkan poin dari misi, ajukan penarikan, dan kelola akun MisiPulsa Anda.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MisiPulsa">
    <meta property="og:locale" content="id_ID">
    <meta property="og:title" content="Dashboard — MisiPulsa">
    <meta property="og:description" content="Kumpulkan poin dari misi, ajukan penarikan, dan kelola akun MisiPulsa Anda.">
    <meta property="og:url" content="/dashboard">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dashboard — MisiPulsa">
    <meta name="twitter:description" content="Kumpulkan poin dari misi, ajukan penarikan, dan kelola akun MisiPulsa Anda.">
    <meta name="twitter:image" content="/og-image.png">

    <!-- Percepatan: preconnect ke CDN & font -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- Font Awesome async (tidak memblokir render) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Ubah URL OG relatif menjadi absolut sesuai domain saat ini -->
    <script>
        (function () {
            var abs = function (sel, attr) {
                var els = document.querySelectorAll(sel);
                for (var i = 0; i < els.length; i++) {
                    var v = els[i].getAttribute(attr);
                    if (v && v.indexOf('http') !== 0) els[i].setAttribute(attr, window.location.origin + v);
                }
            };
            abs('meta[property="og:url"]', 'content');
            abs('meta[property="og:image"]', 'content');
            abs('meta[property="og:image:secure_url"]', 'content');
            abs('meta[name="twitter:image"]', 'content');
        })();
    </script>
</head>
<body class="dashboard-body">
    
    <div id="toast" class="toast"></div>

    <div class="bg-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid"></div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainAppContainer" style="width: 100%; max-width: 420px;">
        <div id="mainApp"></div>
    </div>

    <!-- ============ QRIS MODAL ============ -->
    <div class="qris-modal" id="qrisModal" style="display:none;">
        <div class="qris-box">
            <div class="qris-icon"><i class="fas fa-credit-card"></i></div>
            <h3 id="qrisTitle">Bayar Via QRIS</h3>
            <p id="qrisDesc">Scan QRIS di bawah untuk melakukan pembayaran</p>
            <div class="qris-code">
                <div style="font-size:12px;color:#888;margin-bottom:8px;">QRIS Code untuk Upgrade:</div>
                <div style="background:white;padding:20px;border-radius:8px;border:2px solid #667eea;">
                    <div style="font-size:56px;text-align:center;"><i class="fas fa-mobile-screen-button"></i></div>
                    <div style="font-size:10px;color:#999;margin-top:8px;">QRIS akan muncul di sini</div>
                </div>
                <div style="font-size:11px;color:#888;margin-top:10px;">
                    <strong>ID Transaksi:</strong> <span id="qrisTransactionId">TRX-123456</span>
                </div>
                <div style="font-size:11px;color:#888;">
                    <strong>Upgrade:</strong> <span id="qrisUpgradeType">YouTube</span>
                </div>
                <div style="font-size:11px;color:#888;">
                    <strong>Total:</strong> <span id="qrisAmount">Rp 10.000</span>
                </div>
            </div>
            <p style="font-size:12px;color:#ff9800;margin-top:8px;">
                <i class="fas fa-circle-info"></i> Scan QRIS, lakukan pembayaran, lalu klik tombol di bawah
            </p>
            <button class="btn-paid" onclick="confirmQRISPayment()">
                <i class="fas fa-circle-check"></i> Saya Sudah Bayar
            </button>
            <button class="btn-close-qris" onclick="closeQRISModal()">
                <i class="fas fa-xmark"></i> Tutup
            </button>
        </div>
    </div>

    <!-- SUPABASE JS SDK -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
        <script defer src="config.js"></script>
<script defer src="sistem.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Pulihkan sesi lokal dulu (order-independent terhadap script defer)
            if (typeof loadData === 'function') loadData();
            if (typeof checkSupabaseSession === 'function') {
                await checkSupabaseSession();
            }
            if (currentUser) {
                // Muat misi & riwayat penarikan dari Supabase, lalu render
                if (typeof bootDashboard === 'function') await bootDashboard();
                else if (typeof renderApp === 'function') renderApp();
            }
            // Jika belum login, sistem.js yang menangani:
            // - Supabase aktif  -> redirect ke /login
            // - Mode demo        -> login demo eksplisit (bukan admin)
        });
    </script>
</body>
</html>
