<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Reset Password — MisiPulsa</title>
    <meta name="description" content="Atur ulang kata sandi akun MisiPulsa Anda.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#5a67d8">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MisiPulsa">
    <meta property="og:locale" content="id_ID">
    <meta property="og:title" content="Reset Password — MisiPulsa">
    <meta property="og:description" content="Atur ulang kata sandi akun MisiPulsa Anda.">
    <meta property="og:url" content="/reset-password">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Reset Password — MisiPulsa">
    <meta name="twitter:description" content="Atur ulang kata sandi akun MisiPulsa Anda.">
    <meta name="twitter:image" content="/og-image.png">

    <!-- Percepatan: preconnect ke CDN & font -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- Font Awesome async (tidak memblokir render) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media=&#39;all&#39;"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
    <link rel="stylesheet" href="style.css">

    <!-- Ubah URL OG relatif menjadi absolut sesuai domain saat ini -->
    <script>
        (function () {
            var abs = function (sel, attr) {
                var els = document.querySelectorAll(sel);
                for (var i = 0; i < els.length; i++) {
                    var v = els[i].getAttribute(attr);
                    if (v && v.indexOf('http') !== 0) els[i].setAttribute(attr, window.location.origin + v);
                }
            };
            abs('meta[property="og:url"]', 'content');
            abs('meta[property="og:image"]', 'content');
            abs('meta[property="og:image:secure_url"]', 'content');
            abs('meta[name="twitter:image"]', 'content');
        })();
    </script>
</head>
<body class="auth-page-body">
    
    <div id="toast" class="toast"></div>

    <div class="bg-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid"></div>
    </div>

    <main class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <a href="/" style="text-decoration:none;"><span class="icon"><i class="fas fa-lock"></i></span></a>
                <h2>Reset Password</h2>
                <p id="resetHeaderDesc">Masukkan email terdaftar untuk menerima tautan reset password</p>
            </div>
            
            <div class="auth-body">
                <!-- FORM 1: Kirim link reset ke email -->
                <form id="resetFormSupabase" onsubmit="handleResetSubmit(event)">
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="resetEmail" placeholder="Alamat Email Terdaftar" required>
                    </div>
                    
                    <button type="submit" class="btn-auth" id="resetSubmitBtn">
                        <i class="fas fa-paper-plane"></i> Kirim Link Reset Password
                    </button>
                </form>

                <!-- FORM 2: Set password baru (muncul saat link recovery dibuka) -->
                <form id="newPasswordFormSupabase" style="display:none;" onsubmit="handleNewPasswordSubmit(event)">
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-lock"></i></span>
                        <input type="password" id="newPassword" placeholder="Password Baru (min. 6 karakter)" minlength="6" required>
                    </div>
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-lock"></i></span>
                        <input type="password" id="confirmPassword" placeholder="Ulangi Password Baru" minlength="6" required>
                    </div>

                    <button type="submit" class="btn-auth" id="newPasswordSubmitBtn">
                        <i class="fas fa-key"></i> Simpan Password Baru
                    </button>
                </form>

                <div class="auth-links">
                    <a href="/login"><i class="fas fa-arrow-left"></i> Kembali ke halaman Login</a>
                    <a href="/" style="color: rgba(255,255,255,0.8); margin-top: 6px;"><i class="fas fa-home"></i> Beranda MisiPulsa</a>
                </div>
            </div>
        </div>
    </main>

    <!-- SUPABASE JS SDK (versi dipin, dengan SRI) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
        <script defer src="config.js"></script>
<script defer src="sistem.js"></script>
    <script>
        // ============ MODE 1: Kirim link reset ============
        async function handleResetSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const btn = document.getElementById('resetSubmitBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Mengirim Link...';

            const result = await resetPasswordSupabase(email);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Link Reset Password';
        }

        // ============ MODE 2: Set password baru (token recovery) ============
        function showNewPasswordForm() {
            const resetForm = document.getElementById('resetFormSupabase');
            const newPwForm = document.getElementById('newPasswordFormSupabase');
            const headerDesc = document.getElementById('resetHeaderDesc');
            if (resetForm) resetForm.style.display = 'none';
            if (newPwForm) newPwForm.style.display = 'block';
            if (headerDesc) headerDesc.textContent = 'Masukkan password baru untuk akun Anda';
        }

        async function handleNewPasswordSubmit(e) {
            e.preventDefault();
            const pw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;

            if (!pw || pw.length < 6) {
                showToast('Password minimal 6 karakter.', 'error');
                return;
            }
            if (pw !== confirmPw) {
                showToast('Konfirmasi password tidak sama.', 'error');
                return;
            }
            if (!supabaseClient) {
                showToast('⚠️ Layanan belum dikonfigurasi.', 'error');
                return;
            }

            const btn = document.getElementById('newPasswordSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Menyimpan...';

            const { error } = await supabaseClient.auth.updateUser({ password: pw });
            if (error) {
                showToast('⚠️ Gagal menyimpan password: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> Simpan Password Baru';
                return;
            }

            showToast('✅ Password berhasil diubah! Silakan login.', 'success');
            try { await supabaseClient.auth.signOut(); } catch (err) { /* ignore */ }
            setTimeout(() => { window.location.href = '/login'; }, 1500);
        }

        // ============ DETEKSI LINK RECOVERY ============
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initSupabase === 'function') initSupabase();
            let isRecoveryUrl = false;
            try {
                isRecoveryUrl = window.location.hash.includes('type=recovery') ||
                    new URLSearchParams(window.location.search).get('type') === 'recovery';
            } catch (e) { /* ignore */ }

            if (isRecoveryUrl) showNewPasswordForm();

            // Supabase memproses token di URL secara async; event
            // PASSWORD_RECOVERY dipicu tepat setelah token recovery diproses.
            if (typeof supabaseClient !== 'undefined' && supabaseClient &&
                typeof supabaseClient.auth.onAuthStateChange === 'function') {
                supabaseClient.auth.onAuthStateChange((event) => {
                    if (event === 'PASSWORD_RECOVERY') showNewPasswordForm();
                });
            }
        });
    </script>
</body>
</html>
