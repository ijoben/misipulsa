<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Akun Baru - MisiPulsa (Supabase Auth)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">
    
    <div id="toast" class="toast"></div>

    <div class="bg-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid"></div>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <a href="index.html" style="text-decoration:none;"><span class="icon"><i class="fas fa-gift"></i></span></a>
                <h2>Daftar Akun Supabase</h2>
                <p>Dapatkan <strong>Bonus 100 Poin Gratis</strong> otomatis saat pendaftaran!</p>
            </div>
            
            <div class="auth-body">
                <form id="registerFormSupabase" onsubmit="handleRegisterSubmit(event)">
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-user"></i></span>
                        <input type="text" id="regFullName" placeholder="Nama Lengkap" required>
                    </div>
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-phone"></i></span>
                        <input type="tel" id="regPhone" placeholder="Nomor WhatsApp (misal: 08123456789)" required>
                    </div>
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="regEmail" placeholder="Alamat Email Valid" required>
                    </div>
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-lock"></i></span>
                        <input type="password" id="regPassword" placeholder="Password (min. 6 karakter)" minlength="6" required>
                    </div>
                    <div class="input-group">
                        <span class="icon-left"><i class="fas fa-gift"></i></span>
                        <input type="text" id="regReferral" placeholder="Kode Referral (opsional)" style="text-transform:uppercase;">
                    </div>

                    <button type="submit" class="btn-auth" id="regSubmitBtn">
                        <i class="fas fa-user-plus"></i> Daftar Akun & Klaim 100 Poin
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLoginModal()">
                        <i class="fas fa-bolt"></i> Daftar Cepat (Mode Demo)
                    </button>
                </form>

                <div class="auth-links">
                    <a href="login.html"><i class="fas fa-sign-in-alt"></i> Sudah punya akun? Masuk di sini</a>
                    <a href="index.html" style="color: rgba(255,255,255,0.4); margin-top: 6px;"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </div>

    <!-- SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
        <script src="config.js"></script>
<script src="sistem.js"></script>
    <script>
        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const referral = document.getElementById('regReferral').value;
            const btn = document.getElementById('regSubmitBtn');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Membuat Akun...';
            
            const result = await signUpSupabase(email, password, {
                full_name: fullName,
                phone: phone,
                referral_code: referral
            });
            
            if (result.success) {
                showToast('🎉 Akun Supabase berhasil dibuat (+100 Poin)!', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar Akun & Klaim 100 Poin';
            }
        }
    </script>
</body>
</html>
